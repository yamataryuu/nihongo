name: Validate vocabulary

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check vocabulary data
        run: node scripts/validate.cjs
      - name: Smoke-test standalone build
        run: node scripts/build-standalone.cjs
